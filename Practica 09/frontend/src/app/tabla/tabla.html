<table class="table table-dark table-striped">
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Edad</th>
      <th>Carrera</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let alumno of alumnos">
      <td>{{ alumno.nombre }}</td>
      <td>{{ alumno.edad }}</td>
      <td>{{ alumno.carrera }}</td>
    </tr>
  </tbody>
</table>
