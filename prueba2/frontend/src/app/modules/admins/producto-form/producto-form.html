<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">{{isEditing ? 'Editar' : 'Nuevo'}} Producto</h4>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()">
            <!-- Nombre -->
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre del producto</label>
              <input 
                type="text" 
                class="form-control" 
                id="nombre"
                [(ngModel)]="producto.nombre"
                name="nombre"
                required
              >
            </div>

            <!-- Descripción -->
            <div class="mb-3">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea 
                class="form-control" 
                id="descripcion"
                rows="4"
                [(ngModel)]="producto.descripcion"
                name="descripcion"
                required
              ></textarea>
            </div>

            <!-- Categoría -->
            <div class="mb-3">
              <label for="categoria" class="form-label">Categoría</label>
              <select 
                class="form-select" 
                id="categoria"
                [(ngModel)]="producto.categoria"
                name="categoria"
                required
              >
                <option *ngFor="let cat of categorias" [value]="cat">
                  {{cat | titlecase}}
                </option>
              </select>
            </div>

            <!-- Precios -->
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="precio" class="form-label">Precio actual</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="precio"
                    [(ngModel)]="producto.precio"
                    name="precio"
                    step="0.01"
                    min="0"
                    required
                  >
                </div>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="precioOriginal" class="form-label">Precio original (con descuento)</label>
                <div class="input-group">
                  <span class="input-group-text">$</span>
                  <input 
                    type="number" 
                    class="form-control" 
                    id="precioOriginal"
                    [(ngModel)]="precioOriginal"
                    name="precioOriginal"
                    step="0.01"
                    min="0"
                    (ngModelChange)="onPrecioOriginalChange()"
                  >
                </div>
                <small class="text-muted" *ngIf="descuento">Descuento: {{descuento}}%</small>
              </div>
            </div>

            <!-- Tallas -->
            <div class="mb-3">
              <label class="form-label">Tallas disponibles</label>
              <div class="d-flex flex-wrap gap-2">
                <button 
                  type="button"
                  class="btn me-2 mb-2" 
                  *ngFor="let talla of tallasDisponibles"
                  [class.btn-primary]="producto.tallas.includes(talla)"
                  [class.btn-outline-secondary]="!producto.tallas.includes(talla)"
                  (click)="toggleTalla(talla)"
                >
                  {{talla}}
                </button>
              </div>
            </div>

            <!-- Imagen (simulada) -->
            <div class="mb-3">
              <label class="form-label">Imagen del producto</label>
              <div class="border p-4 text-center rounded">
                <span class="display-1">{{producto.imagenes[0]}}</span>
                <p class="text-muted mt-2">Por ahora usamos emojis como placeholder</p>
              </div>
            </div>

            <!-- Botones -->
            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-secondary" (click)="cancelar()">
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">
                {{isEditing ? 'Actualizar' : 'Crear'}} Producto
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
