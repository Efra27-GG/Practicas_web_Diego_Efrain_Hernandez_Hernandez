<div class="container mt-4">
  <h1>Panel de Administración</h1>
  <p>Bienvenido al panel de administración de ShadowAngels</p>
  
  <div class="row mt-4">
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Productos</h5>
          <p class="card-text">Gestiona el catálogo de productos</p>
          <a routerLink="/admin/productos" class="btn btn-primary">Ir a productos</a>
        </div>
      </div>
    </div>
    
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Nuevo Producto</h5>
          <p class="card-text">Agrega un nuevo producto al catálogo</p>
          <a routerLink="/admin/productos/nuevo" class="btn btn-success">Crear producto</a>
        </div>
      </div>
    </div>
    
    <div class="col-md-4 mb-3">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Admins</h5>
          <p class="card-text">Gestiona los administradores del sistema</p>
          <a routerLink="/admin/admins" class="btn btn-warning">Gestionar admins</a>
        </div>
      </div>
    </div>
  </div>
</div>
