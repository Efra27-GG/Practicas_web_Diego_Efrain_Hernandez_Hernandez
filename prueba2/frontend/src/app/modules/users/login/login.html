<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Iniciar Sesión</h2>
          
          <div *ngIf="error" class="alert alert-danger">
            {{error}}
          </div>
          
          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input 
                type="email" 
                class="form-control" 
                id="email"
                [(ngModel)]="email"
                name="email"
                required
              >
            </div>
            
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input 
                type="password" 
                class="form-control" 
                id="password"
                [(ngModel)]="password"
                name="password"
                required
              >
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">
              Iniciar Sesión
            </button>
            
            <p class="text-center mb-0">
              ¿No tienes cuenta? 
              <a routerLink="/registro">Regístrate aquí</a>
            </p>
          </form>
          
          <div class="mt-4 p-3 bg-light rounded">
            <p class="small text-muted mb-2">Usuarios de prueba:</p>
            <p class="small mb-1">👤 usuario@email.com / 123456</p>
            <p class="small mb-1">👑 admin@shadowangels.com / admin123</p>
            <p class="small mb-0">⭐ super@shadowangels.com / super123</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
