<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Ofertas</h1>
    <div>
      <select class="form-select" style="width: auto;">
        <option>Ordenar por</option>
        <option>Precio: menor a mayor</option>
        <option>Precio: mayor a menor</option>
        <option>Más nuevos</option>
      </select>
    </div>
  </div>
  
  <div class="row">
    <!-- Filtros laterales -->
    <div class="col-md-3">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title">Tallas</h6>
          <div class="mb-3">
            <div class="form-check" *ngFor="let talla of ['Chica', 'Mediana', 'Grande', 'Extra Grande']">
              <input class="form-check-input" type="checkbox">
              <label class="form-check-label">{{talla}}</label>
            </div>
          </div>
          
          <h6 class="card-title">Precio</h6>
          <div class="mb-3">
            <input type="range" class="form-range" min="0" max="1000">
            <div class="d-flex justify-content-between">
              <span>$0</span>
              <span>$1000</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Grid de productos -->
    <div class="col-md-9">
      <div class="row">
        <div class="col-md-4 mb-4" *ngFor="let i of [1,2,3,4,5,6]">
          <div class="card h-100">
            <div class="bg-secondary p-4 text-center">
              <span class="display-6">👕</span>
            </div>
            <div class="card-body">
              <h5 class="card-title">Producto {{i}}</h5>
              <p class="card-text text-muted">Tallas: Ch, M, G</p>
              <p class="fw-bold text-primary">$299.99</p>
              <a class="btn btn-sm btn-outline-primary w-100" [routerLink]="['/producto', i]">Ver detalle</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
