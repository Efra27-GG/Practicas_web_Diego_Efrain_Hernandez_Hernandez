<div class="container mt-4">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Notificaciones</h1>
    <div>
      <button class="btn btn-outline-primary me-2" (click)="marcarTodasComoLeidas()">
        ✓ Marcar todas como leídas
      </button>
    </div>
  </div>

  <!-- Filtros -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="btn-group" role="group">
        <button class="btn" [class.btn-primary]="filtro === 'todas'" (click)="filtro = 'todas'">
          Todas
        </button>
        <button class="btn" [class.btn-primary]="filtro === 'noLeidas'" (click)="filtro = 'noLeidas'">
          No leídas ({{notificacionService.getNoLeidas()}})
        </button>
      </div>
    </div>
  </div>

  <!-- Lista de notificaciones -->
  <div class="notificaciones-list">
    <div *ngIf="getNotificacionesFiltradas().length === 0" class="text-center py-5">
      <span class="display-1 text-muted">📭</span>
      <p class="text-muted mt-3">No tienes notificaciones</p>
    </div>

    <div class="card mb-3" 
         *ngFor="let notif of getNotificacionesFiltradas()"
         [class.border-primary]="!notif.leida">
      <div class="card-body">
        <div class="d-flex">
          <!-- Icono -->
          <div class="me-3">
            <span class="display-6">{{getIcono(notif.tipo)}}</span>
          </div>
          
          <!-- Contenido -->
          <div class="flex-grow-1">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h5 class="card-title mb-1">
                  {{notif.titulo}}
                  <span class="badge bg-primary ms-2" *ngIf="!notif.leida">Nueva</span>
                </h5>
                <p class="card-text">{{notif.mensaje}}</p>
                <small class="text-muted">
                  {{notif.fecha | date:'dd/MM/yyyy HH:mm'}}
                </small>
              </div>
              
              <!-- Acciones -->
              <div>
                <button class="btn btn-sm btn-outline-success me-2" 
                        *ngIf="!notif.leida"
                        (click)="marcarComoLeida(notif.id)"
                        title="Marcar como leída">
                  ✓
                </button>
                <button class="btn btn-sm btn-outline-danger" 
                        (click)="eliminarNotificacion(notif.id)"
                        title="Eliminar">
                  🗑️
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
