<div class="container mt-4">
  <h2 class="text-center mb-4">Listado de Videojuegos</h2>  
  <div class="alert alert-info text-center" *ngIf="games.length === 0">
    No hay videojuegos registrados. Agrega uno desde el menú "Agregar".
  </div>  
  <div class="table-responsive" *ngIf="games.length > 0">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>ID</th>
          <th>Nombre</th>
          <th>Género</th>
          <th>Precio</th>
          <th>Imagen</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let game of games; let i = index">
          <td>{{ i + 1 }}</td>
          <td><small>{{ game._id }}</small></td>
          <td>{{ game.nombre }}</td>
          <td>{{ game.genero }}</td>
          <td>${{ game.precio }}</td>
          <td>
            <img 
              [src]="game.imagenUrl || 'https://via.placeholder.com/50x50?text=No+Image'" 
              [alt]="game.nombre"
              style="width: 50px; height: 50px; object-fit: cover; border-radius: 5px;"
              (error)="game.imagenUrl = 'https://via.placeholder.com/50x50?text=Error'">
          </td>
          <td>
            <button 
              class="btn btn-danger btn-sm"
              (click)="deleteGame(game._id)"
              title="Eliminar videojuego"
            >
              Eliminar
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>  
  <div class="alert alert-secondary mt-3" *ngIf="games.length > 0">
    <strong>Total de videojuegos:</strong> {{ games.length }}
  </div>
</div>
