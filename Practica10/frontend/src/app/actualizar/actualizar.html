<div class="container mt-4">
  <h2 class="text-center mb-4">Actualizar Videojuegos</h2>
  
  <div class="card mb-4">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Selecciona un videojuego para actualizar</h5>
    </div>
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Género</th>
            <th>Precio</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let game of games">
            <td>{{ game.nombre }}</td>
            <td>{{ game.genero }}</td>
            <td>${{ game.precio }}</td>
            <td>
              <button 
                class="btn btn-warning btn-sm"
                (click)="selectGame(game)"
              >
                Actualizar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  <div class="card" *ngIf="selectedGame">
    <div class="card-header bg-success text-white">
      <h5 class="mb-0">Actualizando: {{ selectedGame.nombre }}</h5>
    </div>
    <div class="card-body">
      <form (ngSubmit)="updateGame()">
        <div class="mb-3">
          <label class="form-label">Nombre:</label>
          <input 
            type="text" 
            class="form-control"
            [(ngModel)]="selectedGame.nombre"
            name="nombre"
            required
          >
        </div>
        
        <div class="mb-3">
          <label class="form-label">Género:</label>
          <input 
            type="text" 
            class="form-control"
            [(ngModel)]="selectedGame.genero"
            name="genero"
            required
          >
        </div>
        
        <div class="mb-3">
          <label class="form-label">Precio:</label>
          <input 
            type="number" 
            class="form-control"
            [(ngModel)]="selectedGame.precio"
            name="precio"
            required
          >
        </div>
        
        <div class="mb-3">
          <label class="form-label">URL de Imagen:</label>
          <input 
            type="url" 
            class="form-control"
            [(ngModel)]="selectedGame.imagenUrl"
            name="imagenUrl"
            required
          >
        </div>
        
        <div class="mt-3">
          <button type="submit" class="btn btn-success me-2">
            Guardar Cambios
          </button>
          <button 
            type="button" 
            class="btn btn-secondary"
            (click)="cancelEdit()"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
